      - heading "添加行为" [level=2] [ref=e5728]:
        - link "添加行为" [ref=e5729] [cursor=pointer]:
          - /url: "#/anli/smallAn?id=%e6%b7%bb%e5%8a%a0%e8%a1%8c%e4%b8%ba"
      - generic [ref=e5730]:
        - code [ref=e5731]: "---------------添加行为----------部分来自青木字典------------------------ --详细介绍 https://www.zybuluo.com/longfei/note/600841 SCENE = --args: inst, doer, actions, right --场景 USEITEM = --args: inst, doer, target, actions, right --使用项目 POINT = --args: inst, doer, pos, actions, right --地面 EQUIPPED = --args: inst, doer, target, actions, right --装备 EQUIPPED动作是在你让某个特别的物品被装备时激活。例子：装备火把可以激活点火动作，装备铥矿斧可以砍树，装备武器可以攻击。 INVENTORY = --args: inst, doer, actions, right --库存 INVENTORY动作可以通过右键点击物品栏执行。例子有吃东西，装备物品，治疗等等。 ISVALID = --args: inst, action, right --是有效的 --[[ SCENE 使用变量inst(拥有这个组件的东西），doer（做这个动作的玩家）,actions（你添加的动作会被添加到哪张动作表中去，这个参数一般会在函数参数表的尾端。译者注：如果有right的话，在right前面)，right（是否是一个右键点击动作) SCENE动作是通过点击一个在物品栏或者世界上物品来完成的。拥有这个组件动作的这个东西，让自己能够被点击从而执行动作，这一点与USEITEM和EQUIPPED相反，它们是让你能够点击在你的鼠标所指向的物品，或者物品栏的物品来执行动作。一个例子是收集作物这个动作。 译者注：这里补充几句。edible这个组件，是物品可食用的组件。这个组件没有SCENE 这个组件动作搜集器，只有USEITEM 和 INVENTORY。所以，你不能把食物放在地上，然后右键点击吃掉它（除了woodie的海狸形态，那个比较特殊，这里略过不谈）。要吃掉食物，你只能左键拿起食物，然后对着人点击鼠标，或者把食物放到物品栏里，右键点击。SCEN则就是，你能直接点击它然后完成对应动作。 ]] --[[ USEITEM 使用变量 inst,doer,target(被点击的东西），actions和right。USEITEM动作是这样的，你拿起这个物品（译者注：拥有这个组件动作的物品），去对着世界上的某些其它的物品，就可以激活该动作，按下去就会执行这个动作，典型的例子就是拿起燃料往火坑里添火。 ]] --[[ POINT 使用变量inst,doer,pos（被点击的位置)，actions和right。POINT动作可以被很多东西激活（装备一个手持物品（其它部位不行），或者将一个物品拿起来（附在鼠标上）），但这是唯一一种对着地面而不是一个具体的物体作为变量的动作。典型的例子有deployable组件--种植东西以及放置陷阱。另一个例子则是橙宝石法杖（闪现） ]] ---------------------- local tp_action = AddAction(\"SOULMATETP\", \"传送戒指\", function(act) if act.invobject and act.invobject.components.soulteleporter then return act.invobject.components.soulteleporter:TeleportAction(act.doer) end end) AddComponentAction(\"INVENTORY\", \"soulteleporter\", function SetupTeleportActions(inst, doer, actions) table.insert(actions, GLOBAL.ACTIONS.SOULMATETP) end) AddStategraphActionHandler(\"wilson\", GLOBAL.ActionHandler(GLOBAL.ACTIONS.SOULMATETP, \"give\")) AddStategraphActionHandler(\"wilson_client\", GLOBAL.ActionHandler(GLOBAL.ACTIONS.SOULMATETP, \"give\")) ------------其他动作例子 local CHH_XIUFU = Action() CHH_XIUFU.id = \"CHH_XIUFU\" CHH_XIUFU.str = \"修复\" CHH_XIUFU.priority = -100 -- 设置动作优先级 这里数字越高越优先 CHH_XIUFU.fn = function(act) --doer 就是动作的执行方，target 就是动作的目标 invobject 就是动作执行时对应的物品 pos 就是动作执行的地点，对地面执行的动作会用到这个数据 if act.doer ~=nil and act.invobject ~=nil then print('成功') return true end print('失败') return false end --定义完动作后，要通过这个函数来将定义好的动作添加到游戏当中去 AddAction(CHH_XIUFU) --因为联机版玩家有两个SG——wilson和wilson_client，所以要设定两个 dolongaction 是一个动作 通过State定义 具体有哪些可用的可以看文件SGwilson --give给 手动执行动画（客机） ThePlayer.sg:GoToState(\"dolongaction\") AddStategraphActionHandler(\"wilson\", GLOBAL.ActionHandler(CHH_XIUFU, \"dolongaction\")) AddStategraphActionHandler(\"wilson_client\", GLOBAL.ActionHandler(CHH_XIUFU, \"dolongaction\")) -- 在 USEITEM 中的 inventoryitem 组件生效 AddComponentAction(\"USEITEM\", \"inventoryitem\", function(inst, doer, target, actions, right) --这个函数只有需要显示的时候会判定 不会初始化加载 -- 只在玩家 和 目标有装备耐久 物品耐久的情况出现动作 if doer:HasTag(\"player\") and target ~=nil and (target.components.armor ~= nil or target.components.equippable ~= nil ) then table.insert(actions, GLOBAL.ACTIONS.CHH_XIUFU) end end) --修改动作名称的例子 XXXX为动作 ACTIONS.XXXX.stroverridefn = function(buff) local act = buff and buff.action or nil if act and buff.invobject and buff.target then return string.format('尝试使用【%s】修复【%s】', buff.invobject:GetDisplayName(), buff.target:GetDisplayName()) end return \"修复？\" end ------------文件路径------------ -- script\\entityscript --实体方法定义 -- screens\\redux\\lobbyscreen --选人界面列表 -- scripts\\componentactions 动作类型 -- buffredaction --客机的动作文件 ------------"
        - text: lua