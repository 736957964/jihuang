    - article [ref=e212]:
      - heading "13-world — 地图生成系统 (World Generation)" [level=1] [ref=e5055]:
        - link "13-world — 地图生成系统 (World Generation)" [ref=e5056] [cursor=pointer]:
          - /url: "#/13-world/worldgen?id=_13-world-%e5%9c%b0%e5%9b%be%e7%94%9f%e6%88%90%e7%b3%bb%e7%bb%9f-world-generation"
      - blockquote [ref=e5057]:
        - paragraph [ref=e5058]:
          - text: "源码:"
          - code [ref=e5059]: scripts/map/
          - text: (478+ 文件) 地图生成是 DST 最复杂的系统之一，负责创建整个游戏世界的地形、生态区、资源分布和特殊结构。
      - separator [ref=e5060]
      - heading "1. 地图生成系统架构" [level=2] [ref=e5061]:
        - link "1. 地图生成系统架构" [ref=e5062] [cursor=pointer]:
          - /url: "#/13-world/worldgen?id=_1-%e5%9c%b0%e5%9b%be%e7%94%9f%e6%88%90%e7%b3%bb%e7%bb%9f%e6%9e%b6%e6%9e%84"
      - heading "1.1 核心文件结构" [level=3] [ref=e5063]:
        - link "1.1 核心文件结构" [ref=e5064] [cursor=pointer]:
          - /url: "#/13-world/worldgen?id=_11-%e6%a0%b8%e5%bf%83%e6%96%87%e4%bb%b6%e7%bb%93%e6%9e%84"
      - code [ref=e5066]: "map/ ├── level.lua # 关卡/世界定义 ├── levels.lua # 所有关卡配置 ├── terrain.lua # 地形类型定义 ├── rooms.lua # 房间定义（地形块） ├── room_functions.lua # 房间生成函数 ├── tasks.lua # 任务定义（生成什么） ├── tasksets.lua # 任务集（一组任务） ├── layouts.lua # 静态布局定义 ├── layout.lua # 布局生成逻辑 ├── static_layout.lua # 静态布局系统 ├── object_layout.lua # 对象布局 ├── graphnode.lua # 图节点（房间连接） ├── graphedge.lua # 图边（连接路径） ├── settings.lua # 生成设置 ├── network.lua # 网络相关 ├── customise.lua # 自定义世界设置 ├── customize.lua # 自定义选项 ├── locations.lua # 特殊位置定义 ├── startlocations.lua # 起始位置 ├── pointsofinterest.lua # 兴趣点 ├── protected_resources.lua # 受保护资源 ├── resource_substitution.lua # 资源替换 ├── storygen.lua # 故事生成 ├── boons.lua # 恩赐（奖励箱等） ├── traps.lua # 陷阱 ├── bunches.lua # 资源簇 ├── bunch_spawner.lua # 资源簇生成器 ├── lockandkey.lua # 锁钥机制 ├── maptags.lua # 地图标签 ├── extents.lua # 范围限制 ├── maze_layouts.lua # 迷宫布局 ├── stack.lua # 堆栈工具 ├── placement.lua # 放置工具 ├── blockersets.lua # 阻挡器集合 │ ├── forest_map.lua # 森林地图 ├── caves_retrofit_land.lua # 洞穴改造 ├── ocean_gen.lua # 海洋生成 ├── ocean_gen_config.lua # 海洋生成配置 ├── ocean_retrofit_island.lua # 海洋岛屿改造 ├── monkeyisland_worldgen.lua # 猴岛世界生成 ├── waterlog_worldgen.lua # 水木世界生成 ├── archive_worldgen.lua # 档案区世界生成 ├── retrofit_savedata.lua # 存档数据改造 │ ├── levels/ # 关卡配置文件 ├── rooms/ # 42 个房间定义文件 ├── tasks/ # 10 个任务定义文件 ├── tasksets/ # 任务集配置 └── static_layouts/ # 340 个静态布局文件"
      - heading "1.2 世界生成流程" [level=3] [ref=e5067]:
        - link "1.2 世界生成流程" [ref=e5068] [cursor=pointer]:
          - /url: "#/13-world/worldgen?id=_12-%e4%b8%96%e7%95%8c%e7%94%9f%e6%88%90%e6%b5%81%e7%a8%8b"
      - code [ref=e5070]: 1. settings.lua → 读取世界设置（大小、季节等） 2. level.lua → 初始化关卡 3. terrain.lua → 生成地形基础 4. graphnode.lua → 创建房间图节点 5. rooms.lua → 定义房间内容 6. tasks.lua → 执行生成任务 7. static_layout.lua → 放置静态结构 8. pointsofinterest.lua → 标记特殊位置
      - separator [ref=e5071]
      - heading "2. 地形系统 (terrain.lua)" [level=2] [ref=e5072]:
        - link "2. 地形系统 (terrain.lua)" [ref=e5073] [cursor=pointer]:
          - /url: "#/13-world/worldgen?id=_2-%e5%9c%b0%e5%bd%a2%e7%b3%bb%e7%bb%9f-terrainlua"
