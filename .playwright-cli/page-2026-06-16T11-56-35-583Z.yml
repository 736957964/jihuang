      - list [ref=e9062]:
        - listitem [ref=e9063]: "字典 ```lua"
        - listitem [ref=e9064]: "-by:う丶青木"
        - listitem [ref=e9065]: "-ps:删减版随手笔记"
        - listitem [ref=e9066]:
          - text: "----------------------------------------常用函数------------------------------------------------ GLOBAL.TheWorld --获取世界 GLOBAL.unpack --解包表格 components --组件模块 return --返回结果 break --直接跳出循环 SpawnPrefab(\"ash\") --产卵预设实体 local x,y,z = ConsoleWorldPosition():Get() --指针坐标 local x,y,z = inst.Transform:GetWorldPosition() --获取实体坐标 inst.Transform:SetPosition(0,0,0) local pos = inst:GetPosition() --获取实体坐标【Vector3()】 x, y = TheSim:GetScreenPos(x,y,z) --获取世界坐标 到 屏幕上的像素坐标点 local qm = GLOBAL.TheSim:FindEntities(x, 0, z, 1, {\"_combat\",\"_health\",\"locomotor\",\"_inventoryitem\"}, {\"locomotor\",\"FX\",\"NOCLICK\",\"DECOR\",\"INLIMBO\",\"nightmarecreature\"}) local qm = FindEntity(inst, 8, function(guy) for k,v in pairs(ents) do --循环乱序读取 for i,v in ipairs(ents) do --循环顺序读取 while true do Sleep(0.1) end --循环 repeat Sleep(0.1) until true --循环 inst.persists = false --不持续存在 local maxw,maxh = GLOBAL.TheSim:GetScreenSize() --获取句柄最大尺寸 distsq(Vector3(0,0,0), inst:GetPosition()) > 2"
          - emphasis [ref=e9067]: 2 --测距 inst:GetDistanceSqToPoint(0,0,0) > 2
          - text: "2 --测距 inst:FacePoint(x,y,z) --面向点 inst:ForceFacePoint(x,y,z) --强制面向点 function() --函数fn inst:Remove() --实体删除 UserToPlayer('う丶青木') --获取玩家 GetPlayer() --获取玩家 ThePlayer --获取玩家 ThePlayer.userid --获取玩家的KU_ID self:GetGUID() --获取实体标识符ID Ents[guid] --获取标识符ID的实体 inst:AddTag(\"NOCLICK\") --不可被点击，查看 inst:AddTag(\"NOBLOCK\") --不可被查看 建造不会被遮挡 inst:AddTag(\"notarget\") --不能被作为目标 inst:AddTag(\"CLASSIFIED\") --增加保密标签 inst:RemoveTag(\"pollinator\") inst:HasTag(\"player\") --判定有\"player\"标签 inst:HasTag(\"playerghost\") --判定有\"playerghost\"标签 inst:IsStandState(\"quad\") --判定有\"quad\" 行为标签 inst:SetStandState(\"quad\") --设置增加\"quad\" 行为标签 inst.sg:RemoveStateTag(\"busy\") --设置取消\"busy\" 行为标签 math.random() --获取随机数 function GetRandomMinMax(min, max) return min + math.random()*(max - min) end weighted_random_choice({qm=20,mp=10}) --获取质量随机数 inst:SetPrefabNameOverride(\"qm\") --重设预设物名字 GLOBAL.STRINGS.NAMES[string.upper(\"qm\")] GLOBAL.FRAMES --33毫秒 fx.entity:SetParent(A.entity) --跟随实体 inst:IsValid() --是否为有效单位 inst:IsInLimbo() --是否被库存 inst.entity:IsVisible() --实体是否显示状态 inst.entity:SetInLimbo(true) --设置离开状态 inst.prefab == \"wes\" --实体预设名 inst:SetDeployExtraSpacing(4) --设置额外间距 inst:AddComponent(\"talker\") --添加\"话语者\"组件 inst:RemoveComponent(\"talker\") --删除\"话语者\"组件 inst.OnEntityWake = onwake --实体激活时调用 if inst.entity:IsAwake() then inst.OnEntitySleep = onsleep --实体休眠时调用 inst.entity:SetCanSleep(false) --不会进入休眠状态"
