        - text: "local Widget = require('widgets/widget') -------------------------------------------Widget--------------------------------------------- Widget:IsDeepestFocus() --是否被指针聚焦【如果焦点在子实体上，返回false】 返回值true Widget:OnMouseButton(button, down, x, y) --在被点击时候调用 Widget:MoveToBack() --搬到底层 Widget:MoveToFront() --搬到前段 Widget:OnFocusMove(dir, down) --在被指针聚焦时调用 Widget:IsVisible() --是否为显示状态 Widget:OnRawKey(key, down) --在被聚焦时候，按键行为fn Widget:OnTextInput(text) --在被输入字符串时候调用 Widget:ScaleTo(from, to, time, fn) --变换大小【动画】【指定从大小，变换到大小，时间，完成后调用【可nil】】 Widget:MoveTo(from, to, time, fn) --移动位置【动画】【指定从位置，移动到位置，时间，完成后调用【可nil】】 Widget:CancelMoveTo(run_complete_fn) --|取消移动【可nil】 Widget:TintTo(from, to, time, fn) --变换颜色【动画】 Widget:ForceStartWallUpdating() --强制启动动画完成之前的设定 Widget:ForceStopWallUpdating() --强制停止动画效果 Widget:GetParent() --获取父体 Widget:GetChildren() --获取子表 返回 {} Widget:RemoveChild(child) --删除指定子体 Widget:KillAllChildren() --删除全部子体 Widget:AddChild(child) --增加指定子体 Widget:Hide() --实体显示 Widget:OnHide() --在实体被显示时候调用 Widget:Show() --实体隐藏 Widget:OnShow() --在实体被隐藏时候调用 Widget:Kill() --删除自己 Widget:GetWorldPosition() --获取在世界上的坐标 Widget:GetPosition() --获取被附加后的偏移坐标 Widget:GetLocalPosition() --获取被附加后的偏移坐标【同上，函数功能一模一样】 Widget:Nudge(offset) --在现有偏移坐标上 + offset坐标 Widget:SetPosition(pos, y, z) --设置坐标 Widget:UpdatePosition(x, y) --设置坐标【同上】 Widget:SetRotation(angle) --设置旋转 Widget:SetScaleMode(mode) --设置缩放模式【0原始 1满屏 2均衡 3固定比例 4非动态】 Widget:SetScale(pos, y, z) --设置大小比例【0-1】 Widget:HookCallback(event, fn) --设置监听事件【self.callbacks[event] = fn】 Widget:SetVAnchor(anchor) --设置位置【上下便宜 0居中,1顶对齐,2底对齐】 Widget:SetHAnchor(anchor) --设置位置【左右偏移 0居中,1左对齐,2右对其】 Widget:StartUpdating() --开启循环更新【:OnUpdate(dt)】 Widget:StopUpdating() --停止循环更新【:OnUpdate(dt)】 Widget:SetFadeAlpha(alpha, skipChildren) --设置透明度【参数2，为nil时，子体同步设置】 Widget:SetCanFadeAlpha(fade, skipChildren) --设置可以被调整透明度【true or false ，true or nil，为nil时，子体同步设置】 Widget:SetClickable(val) --设置可否被点击【true or false】 Widget:SetOnClick(function() end) --被点击时调用 Widget:FollowMouse() --开启跟随指针 Widget:StopFollowMouse() --停止跟随指针 Widget:GetScale() --获得大小比例【优先获取父体】"
        - text: "Widget:GetLooseScale() --获取大小比例【自己】 Widget:GetDeepestFocus() --获取被指针聚焦的实体【优先级：子体】 Widget:GetFocusChild() --获取被指针聚焦的实体【子体】 Widget:ClearFocus() --取消被聚焦状态【调用self:OnLoseFocus() 和 self.onlosefocusfn()】 Widget:SetFocus() --设置聚焦状态【调用self:OnGainFocus() 和 self.ongainfocusfn()】 Widget:SetHoverText(text, params) --设置指针悬停信息 --[[ A:SetHoverText(\"111\",{}) --参数2详细↓ A:ClearHoverText() --删除悬停信息 { font = DEFAULTFONT, --悬停文本字体 size = 28, --文本字体大小 region_h = 1000, --设置区域 region_w = 40, --设置区域 wordwrap = true, --自动换行 offset_x = 0, --坐标偏移 offset_y = 0, --坐标偏移 colour = {1,1,1,1}, --设置色彩 bg = true, --悬停开启背景框 false为不启用 bg_atlas = \"images/frontend.xml\", --设置xml bg_texture = \"scribble_black.tex\", --设置tex } ]] --删除悬停信息 --剪切图层 --例： --血条缩减效果"
