      - heading "5.1 基础 SG 模板" [level=3] [ref=e4833]:
        - link "5.1 基础 SG 模板" [ref=e4834] [cursor=pointer]:
          - /url: "#/06-stategraphs/sg-reference?id=_51-%e5%9f%ba%e7%a1%80-sg-%e6%a8%a1%e6%9d%bf"
      - generic [ref=e4835]:
        - code [ref=e4836]: "-- SGmycreature.lua require(\"stategraphs/commonstates\") local actionhandlers = { ActionHandler(ACTIONS.ATTACK, \"attack\"), ActionHandler(ACTIONS.EAT, \"eat\"), } local events = { CommonHandlers.OnLocomote(false, true), -- 走路+跑步 CommonHandlers.OnAttacked(), CommonHandlers.OnDeath(), CommonHandlers.OnSleep(), CommonHandlers.OnFreeze(), CommonHandlers.OnAttack(), CommonHandlers.OnHit(), CommonHandlers.OnEat(), EventHandler(\"my_event\", function(inst, data) if not (inst.sg:HasStateTag(\"busy\") or inst.sg:HasStateTag(\"dead\")) then inst.sg:GoToState(\"my_state\", data) end end), } local states = { State{ name = \"idle\", tags = { \"idle\", \"canrotate\" }, onenter = function(inst) inst.AnimState:PlayAnimation(\"idle\", true) -- true = 循环 end, events = { EventHandler(\"animover\", function(inst) inst.sg:GoToState(\"idle\") end), }, }, State{ name = \"attack\", tags = { \"attack\", \"busy\", \"canrotate\" }, onenter = function(inst, target) inst.components.combat:StartAttack() inst.AnimState:PlayAnimation(\"attack\") inst.sg.statemem.target = target end, timeline = { TimeEvent(8 * FRAMES, function(inst) inst.components.combat:DoAttack(inst.sg.statemem.target) end), }, events = { EventHandler(\"animover\", function(inst) inst.sg:GoToState(\"idle\") end), }, }, State{ name = \"death\", tags = { \"busy\", \"dead\" }, onenter = function(inst) inst.AnimState:PlayAnimation(\"death\") inst.components.lootdropper:DropLoot() end, events = { EventHandler(\"animover\", function(inst) inst:Remove() end), }, }, } return StateGraph(\"mycreature\", states, events, \"idle\", actionhandlers)"
        - text: lua
      - heading "5.2 TimeEvent 用法" [level=3] [ref=e4837]:
        - link "5.2 TimeEvent 用法" [ref=e4838] [cursor=pointer]:
          - /url: "#/06-stategraphs/sg-reference?id=_52-timeevent-%e7%94%a8%e6%b3%95"
      - generic [ref=e4839]:
        - code [ref=e4840]: "timeline = { -- 在动画的第 N 帧执行 TimeEvent(5 * FRAMES, function(inst) -- 第 5 帧 end), TimeEvent(10 * FRAMES, function(inst) -- 第 10 帧 end), -- 根据动画事件触发 TimeEvent(\"hit\", function(inst) -- 动画中标记 \"hit\" 的位置 end), -- 范围事件 TimeEvent(5 * FRAMES, 15 * FRAMES, function(inst) -- 5-15 帧期间持续执行 end), }"
        - text: lua
      - heading "5.3 状态转换" [level=3] [ref=e4841]:
