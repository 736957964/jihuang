      - generic [ref=e4843]:
        - code [ref=e4844]: "-- 基本转换 inst.sg:GoToState(\"walk\") -- 带参数转换 inst.sg:GoToState(\"attack\", target) -- 条件转换 if not inst.sg:HasStateTag(\"busy\") then inst.sg:GoToState(\"idle\") end -- 检查当前状态 if inst.sg:HasStateTag(\"idle\") then -- 在待机中 end -- 获取当前状态名 local state = inst.sg.currentstate.name"
        - text: lua
